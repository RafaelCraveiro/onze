# Blueprint do Render — em render.com podes "New +" → "Blueprint" e apontar
# a este repositório para configurar tudo de uma vez, ou configurar à mão em
# "New +" → "Web Service" com os mesmos valores (Build/Start Command abaixo).
#
# Os dados ficam no Postgres do Supabase, por isso sobrevivem a reinícios e
# novos deploys. Define DATABASE_URL em Environment com a ligação "Session
# pooler" do Supabase (Connect, no painel do projeto). O plano "free" do Render
# adormece ao fim de ~15 min parado, mas já não perde dados.
services:
  - type: web
    name: onze
    runtime: node
    plan: free
    buildCommand: npm install --include=dev && npm run build
    startCommand: npm run server
    envVars:
      - key: NODE_VERSION
        value: 22.12.0
      - key: NODE_ENV
        value: production
      - key: DATABASE_URL
        sync: false
